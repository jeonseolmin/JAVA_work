<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback_button</title>
    
</head>

<body>
    <button id = "startBtn">
        알림 시작
    </button>
</body>
<script>

        function showMessage(message) {
            alert(message)
        }
        document.getElementById('startBtn').addEventListener('click',function() {
            console.log('버튼 클릭 2초가 지난 뒤에 알림이 울림.')
            setTimeout(function(){showMessage("안녕하세요 2초가 지났습니다.")}, 2000)
        })
</script>
</html>
